[project]
name = "fastai-course22"
version = "0.1.0"
requires-python = "==3.12.11"
dependencies = [
    "ddgs==9.16.1",
    "fastai==2.8.12",
    "fastdownload==0.0.8",
    "fastprogress==1.0.3",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pillow==12.2.0",
    "ipykernel==6.30.1",
    "jupyterlab==4.4.10",
    "ipywidgets==8.1.8",
    "plotly==6.3.1",
    "statsmodels==0.14.5",
    "seaborn==0.13.2",
    "graphviz==0.21",
    "fastkaggle==0.0.8",
    "kaggle==1.7.4.5",
    "timm==1.0.22",
    "datasets==5.2.0",
    "transformers==5.16.1",
    "accelerate==1.12.0",
    "sentencepiece==0.2.1",
    "protobuf==6.33.5",
]

[dependency-groups]
dev = ["uv==0.9.18"]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
